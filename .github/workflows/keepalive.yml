name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping WMS to reset Render idle timer
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" -m 120 https://wms-i4kr.onrender.com/api/health || echo "curl exit ignored (non-fatal)"